[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llmshield-local"
version = "1.0.0"
description = "Controlled local LLM security assessment lab"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "httpx>=0.27,<1", "jinja2>=3.1.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
llmshield = "llmshield.cli:main"

[tool.setuptools.packages.find]
include = ["llmshield*"]

[tool.setuptools.package-data]
llmshield = ["test_cases/*.json", "synthetic_data/*.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
